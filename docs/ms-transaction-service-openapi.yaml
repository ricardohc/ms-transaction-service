openapi: 3.0.3
info:
  title: Transaction Service API
  description: Orquestador único de operaciones monetarias. Estados asíncronos. Idempotente por X-Transaction-ID.
  version: 1.0.0

tags:
  - name: Transaction
    description: Operaciones de orquestación de transacciones monetarias

security:
  - BearerAuth: []
paths:
  /api/v1/transactions:
    post:
      tags:
        - Transaction
      summary: Iniciar operación transaccional
      description: |
        Idempotente. Si X-Transaction-ID ya existe, retorna la transacción original (202). Timeout de 30s para servicios participantes.
        
        **Reglas de seguridad y trazabilidad:**
        - Para operaciones WALLET_TRANSFER, el monedero de origen **NO** se envía en el request. Se obtiene de la identidad autenticada (JWT).
        - El servicio valida que el teléfono del JWT corresponda al monedero de origen y que el usuario sea titular del mismo antes de ejecutar la transferencia.
        - El cliente no puede seleccionar arbitrariamente el monedero de origen.
      operationId: createTransaction
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionCreateRequest' } } }
      responses:
        '202':
          description: Transacción aceptada para orquestación
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationAcceptedResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/transactions/{transactionId}:
    get:
      tags:
        - Transaction
      summary: Consultar estado de la transacción
      operationId: findTransactionById
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
      responses:
        '200':
          description: Estado de la transacción
          content: { application/json: { schema: { $ref: '#/components/schemas/TransactionResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CorrelationIdHeader: { name: X-Correlation-ID, in: header, required: true, schema: { type: string } }
    ChannelIdHeader: { name: X-Channel-ID, in: header, required: true, schema: { type: string } }
    TransactionIdHeader: { name: X-Transaction-ID, in: header, required: true, schema: { type: string, format: uuid } }
    TransactionIdPath: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    TransactionType: { type: string, enum: [ACCOUNT_TRANSFER, CREDIT_PAYMENT, CARD_CONSUMPTION, WALLET_TRANSFER] }
    TransactionStatus: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED, COMPENSATED] }
    TransactionCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/AccountTransferTransaction'
        - $ref: '#/components/schemas/CreditPaymentTransaction'
        - $ref: '#/components/schemas/CardConsumptionTransaction'
        - $ref: '#/components/schemas/WalletTransferTransaction'
    AccountTransferTransaction:
      type: object
      required: [type, amount, currency, sourceAccountId, targetAccountId]
      properties:
        type: { type: string, enum: [ACCOUNT_TRANSFER] }
        amount: { type: string, pattern: '^(?!0+(\.0+)?$)[0-9]+(\.[0-9]{1,2})?$', description: "Monto positivo mayor a cero" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        sourceAccountId: { type: string, format: uuid }
        targetAccountId: { type: string, format: uuid }
        description: { type: string }
    CreditPaymentTransaction:
      type: object
      required: [type, amount, currency, creditId, sourceAccountId]
      properties:
        type: { type: string, enum: [CREDIT_PAYMENT] }
        amount: { type: string, pattern: '^(?!0+(\.0+)?$)[0-9]+(\.[0-9]{1,2})?$', description: "Monto positivo mayor a cero" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        creditId: { type: string, format: uuid }
        sourceAccountId: { type: string, format: uuid }
        description: { type: string }
    CardConsumptionTransaction:
      type: object
      required: [type, amount, currency, cardId, merchant]
      properties:
        type: { type: string, enum: [CARD_CONSUMPTION] }
        amount: { type: string, pattern: '^(?!0+(\.0+)?$)[0-9]+(\.[0-9]{1,2})?$', description: "Monto positivo mayor a cero" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        cardId: { type: string, format: uuid }
        merchant: { type: string }
        description: { type: string }
    WalletTransferTransaction:
      type: object
      description: |
        **Seguridad:** El monedero de origen NO se envía en el request. Se obtiene de la identidad autenticada (JWT).
        El servicio valida la titularidad del monedero antes de ejecutar la transferencia.
      required: [type, amount, currency, targetPhoneNumber]
      properties:
        type: { type: string, enum: [WALLET_TRANSFER] }
        amount: { type: string, pattern: '^(?!0+(\.0+)?$)[0-9]+(\.[0-9]{1,2})?$', description: "Monto positivo mayor a cero" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        targetPhoneNumber: { type: string, pattern: '^[0-9]{9,15}$', description: "Teléfono del monedero de destino (Yanki)" }
        description: { type: string }
    TransactionResponse:
      type: object
      description: |
        - ACCOUNT_TRANSFER: sourceId = cuenta origen, targetId = cuenta destino.
        - CREDIT_PAYMENT: sourceId = cuenta origen, targetId = crédito pagado.
        - CARD_CONSUMPTION: sourceId = tarjeta de crédito, targetId = null.
        - WALLET_TRANSFER: sourceId = wallet origen, targetId = wallet destino.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        amount: { type: string }
        currency: { type: string }
        sourceId: { type: string, format: uuid, description: "UUID según el tipo de operación (cuenta, crédito, tarjeta o wallet de origen)" }
        targetId: { type: string, format: uuid, nullable: true, description: "UUID según el tipo de operación (cuenta, crédito, tarjeta o wallet de destino). Puede ser null para CARD_CONSUMPTION." }
        sourceWalletPhoneNumber: { type: string, description: "Solo para WALLET_TRANSFER" }
        targetPhoneNumber: { type: string, description: "Solo para WALLET_TRANSFER" }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        failureReason: { type: string }
    OperationAcceptedResponse:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, PENDING] }
    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: No autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: No autorizado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Transacción no encontrada
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Conflicto (idempotencia, estado)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: Entidad no procesable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalServerError:
      description: Error interno
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }